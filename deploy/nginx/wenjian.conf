server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/wenjian;
    index index.html;
    client_max_body_size 128k;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # deploy/scripts/deploy.sh renders WORKER_ORIGIN without a trailing slash.
        # That keeps the original /api/... request path when proxying to Worker.
        proxy_pass WORKER_ORIGIN;

        proxy_http_version 1.1;
        proxy_set_header Host WORKER_HOST;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_server_name on;
        proxy_ssl_name WORKER_TLS_NAME;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
